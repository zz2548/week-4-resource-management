<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cooking Game — Resource Flow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1208;
    color: #f0e6c8;
    font-family: 'Crimson Pro', serif;
    min-height: 100vh;
    overflow-x: auto;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(180,120,20,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(80,40,120,0.12) 0%, transparent 60%);
  }

  h1 {
    font-family: 'Cinzel', serif;
    text-align: center;
    font-size: 2rem;
    letter-spacing: 0.15em;
    padding: 2rem 1rem 0.5rem;
    color: #f5c842;
    text-shadow: 0 0 30px rgba(245,200,66,0.4);
  }
  .subtitle {
    text-align: center;
    font-style: italic;
    color: #a08860;
    margin-bottom: 1.2rem;
    font-size: 1.1rem;
  }

  /* Legend — single row, no wrap */
  .legend {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 1.4rem;
    margin: 0 auto 1.8rem;
    max-width: 1100px;
    padding: 0.65rem 1.5rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(245,200,66,0.15);
    border-radius: 8px;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .legend-item { display: flex; align-items: center; gap: 0.45rem; }
  .leg-box {
    width: 24px; height: 16px; border-radius: 3px;
    border: 2px solid;
    flex-shrink: 0;
  }

  svg {
    display: block;
    margin: 0 auto;
    max-width: 1100px;
    width: 100%;
  }

  .node-base { rx: 8; ry: 8; }
  .node-ingredient { fill: #2a3d1e; stroke: #6abf45; stroke-width: 2; }
  .node-combined   { fill: #1e2e45; stroke: #4a90d9; stroke-width: 2; }
  .node-enemy      { fill: #3d1e1e; stroke: #d94a4a; stroke-width: 2; }

  .node-label {
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    font-weight: 600;
    fill: #f0e6c8;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .node-sublabel {
    font-family: 'Crimson Pro', serif;
    font-size: 10px;
    fill: #a08860;
    text-anchor: middle;
    dominant-baseline: middle;
    font-style: italic;
  }
  .sat-badge {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .tag {
    font-family: 'Crimson Pro', serif;
    font-size: 9.5px;
    fill: #f0e6c8;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .tag-pill { rx: 6; ry: 6; opacity: 0.85; }

  .arrow-base { fill: none; stroke-width: 2; }
  .arrow-craft  { stroke: #4a90d9; }
  .arrow-defeat { stroke: #d94a4a; stroke-dasharray: 6 3; }

  .section-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    fill: #a08860;
    text-anchor: middle;
  }
  .section-box { fill: none; stroke: rgba(160,136,96,0.2); stroke-width: 1; rx: 12; ry: 12; stroke-dasharray: 4 4; }
</style>
</head>
<body>

<h1>Resource Flow Diagram</h1>
<p class="subtitle">Ingredients · Crafting · Enemies</p>

<div class="legend">
  <div class="legend-item">
    <div class="leg-box" style="background:#2a3d1e;border-color:#6abf45;"></div>
    <span>Base Ingredient</span>
  </div>
  <div class="legend-item">
    <div class="leg-box" style="background:#1e2e45;border-color:#4a90d9;"></div>
    <span>Crafted Result</span>
  </div>
  <div class="legend-item">
    <div class="leg-box" style="background:#3d1e1e;border-color:#d94a4a;"></div>
    <span>Enemy</span>
  </div>
  <div class="legend-item">
    <svg width="40" height="16"><defs><marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4a90d9"/></marker></defs>
    <line x1="2" y1="8" x2="34" y2="8" stroke="#4a90d9" stroke-width="2" marker-end="url(#ah)"/></svg>
    <span>Crafts into</span>
  </div>
  <div class="legend-item">
    <svg width="40" height="16"><defs><marker id="ah2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d94a4a"/></marker></defs>
    <line x1="2" y1="8" x2="34" y2="8" stroke="#d94a4a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah2)"/></svg>
    <span>Defeats enemy</span>
  </div>
</div>

<svg viewBox="0 0 1060 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d94a4a"/>
    </marker>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SECTION BACKGROUNDS -->
  <rect x="10" y="30" width="310" height="615" class="section-box"/>
  <text x="165" y="22" class="section-label">BASE INGREDIENTS</text>

  <rect x="335" y="30" width="335" height="615" class="section-box"/>
  <text x="502" y="22" class="section-label">POT CRAFTING</text>

  <rect x="685" y="30" width="365" height="615" class="section-box"/>
  <text x="867" y="22" class="section-label">ENEMIES</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- BASE INGREDIENTS
       Left col:  x=20,  w=135, right edge=155
       Right col: x=165, w=135, right edge=300
       Rows at y: 50, 160, 275, 390
  -->
  <!-- ══════════════════════════════════════════ -->

  <!-- ROW 1: Pepper | Squid -->

  <text x="87"  y="67" class="node-label">Pepper</text>
  <text x="87"  y="81" class="node-sublabel">sat: 2</text>
  <rect x="25"  y="91" width="40" height="14" class="tag-pill" fill="#7a3a00"/>

  <rect x="69"  y="91" width="52" height="14" class="tag-pill" fill="#2a5a1a"/>

  <rect x="165" y="50" width="135" height="52" class="node-base node-ingredient" filter="url(#glow-green)"/>

  <text x="232" y="81" class="node-sublabel">sat: 3</text>

  <rect x="165" y="390" width="135" height="52" class="node-base node-ingredient" filter="url(#glow-green)"/>
  <text x="232" y="404" class="node-label">Magic</text>
  <text x="232" y="418" class="node-label">Mushroom</text>
  <text x="232" y="432" class="node-sublabel">sat: 2</text>
  <rect x="204" y="431" width="32" height="14" class="tag-pill" fill="#2a4a5a"/>

  <text x="160" y="527" class="node-sublabel" style="fill:#4a90d9;font-size:10.5px;">— boosted +5 protein versions</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- CRAFTED RESULTS
       x=348, w=150, right edge=498
       Fire Squid   y=50
       Garlic Oil   y=160
       Magical Egg  y=275
       Sus Meat     y=390
       Darkmatter   y=500
  -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Fire Squid -->
  <rect x="348" y="50"  width="150" height="52" class="node-base node-combined" filter="url(#glow-blue)"/>
  <text x="423" y="67"  class="node-label">Fire Squid</text>
  <text x="423" y="81"  class="node-sublabel">sat: 8</text>
  <rect x="353" y="91"  width="46" height="14" class="tag-pill" fill="#7a3a00"/>

  <rect x="403" y="91"  width="46" height="14" class="tag-pill" fill="#005a6e"/>

  <rect x="378" y="201" width="41" height="14" class="tag-pill" fill="#5a4a00"/>

  <rect x="354" y="316" width="36" height="14" class="tag-pill" fill="#7a3a7a"/>

  <rect x="394" y="316" width="42" height="14" class="tag-pill" fill="#3a5a1a"/>
  <text x="415" y="323" class="tag">protein</text>
  <circle cx="490" cy="290" r="12" fill="#f5c842" opacity="0.9"/>

  <circle cx="490" cy="405" r="12" fill="#f5c842" opacity="0.9"/>

  <!-- Darkmatter — node-combined (blue), not special -->
  <rect x="348" y="500" width="150" height="52" class="node-base node-combined" filter="url(#glow-blue)"/>
  <text x="423" y="517" class="node-label">Darkmatter</text>
  <text x="423" y="531" class="node-sublabel">sat: 15</text>
  <rect x="366" y="541" width="58" height="14" class="tag-pill" fill="#3a0a5a"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- ENEMIES -->

  <rect x="700" y="50"  width="345" height="68" class="node-base node-enemy"/>

  <!-- ══════════════════════════════════════════ -->

       Left-col ingredients exit right edge at x=155.
       Right-col ingredients exit right edge at x=300.
       Arrows for left-col items arc BELOW their row (avoiding
       the right-col node) before entering crafted node at x=348.
       Right-col items go straight across.
  -->

  <!-- Pepper (155,76) -> arc below row -> Fire Squid (348,76) -->

        class="arrow-base arrow-craft" marker-end="url(#arrow-blue)"/>
  <!-- Squid (300,76) -> straight -> Fire Squid -->

</body>
</html>
